name: Herbario
options:
  bundleIdPrefix: com.portfolio.herbario
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
targets:
  Herbario:
    type: application
    platform: iOS
    sources:
      - path: Herbario
        excludes:
          - "**/*.md"
    resources:
      - path: Herbario/Resources/Assets.xcassets
    info:
      path: Herbario/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "O Herbário usa a câmera para fotografar plantas e identificá-las na hora."
        NSPhotoLibraryUsageDescription: "O Herbário acessa suas fotos para identificar plantas salvas na galeria."
        PLANTNET_API_KEY: "$(PLANTNET_API_KEY)"
        CFBundleDisplayName: "Herbário"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.portfolio.herbario
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: "YES"
schemes:
  Herbario:
    build:
      targets:
        Herbario: all
    run:
      config: Debug
