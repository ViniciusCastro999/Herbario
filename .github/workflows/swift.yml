# This workflow will build a Swift iOS project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode version
      run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
    
    - name: Build
      run: xcodebuild -project Herbario.xcodeproj -scheme Herbario -configuration Debug -arch arm64 -derivedDataPath build
    
    - name: Run tests
      run: xcodebuild -project Herbario.xcodeproj -scheme Herbario -configuration Debug -arch arm64 test -derivedDataPath build
